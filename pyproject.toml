[project]
name = "langchain-langgraph-lab"
version = "0.1.0"
description = "A hands-on AI technical document reviewer built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "django>=5.1,<5.3",
  "djangorestframework>=3.15,<3.17",
  "langchain>=0.3,<0.4",
  "langchain-ollama>=0.2,<0.4",
  "langgraph>=0.2,<0.4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5.0,<6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_reviewer"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-django>=4.9,<5", "ruff>=0.8,<1"]
rag = ["chromadb>=0.5,<1", "langchain-chroma>=0.1,<0.3"]
training = ["torch>=2.5", "transformers>=4.46", "peft>=0.13", "datasets>=3.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
